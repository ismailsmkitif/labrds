{% extends "base.html" %}

{% block title %}Edit Produk #{{ product.id }} - AWS Cloud CRUD{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card card-custom">
            <div class="card-header bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold text-dark">
                    <i class="bi bi-pencil-square text-primary me-2"></i> Edit Data Produk (ID: #{{ product.id }})
                </h5>
                <a href="{{ url_for('index') }}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Kembali ke Katalog
                </a>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('edit_product', product_id=product.id) }}" method="POST">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label for="name" class="form-label fw-semibold">Nama Produk <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ product.name }}" required>
                        </div>
                        <div class="col-md-4">
                            <label for="sku" class="form-label fw-semibold">Kode SKU <span class="text-danger">*</span></label>
                            <input type="text" class="form-control font-monospace" id="sku" name="sku" value="{{ product.sku }}" required>
                        </div>

                        <div class="col-md-4">
                            <label for="category" class="form-label fw-semibold">Kategori</label>
                            <select class="form-select" id="category" name="category" required>
                                {% for cat in ['Buku', 'Elektronik', 'Aksesoris', 'Merchandise', 'Software', 'Lainnya'] %}
                                    <option value="{{ cat }}" {% if product.category == cat %}selected{% endif %}>{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="price" class="form-label fw-semibold">Harga (IDR) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">Rp</span>
                                <input type="number" step="0.01" min="0" class="form-control" id="price" name="price" value="{{ product.price }}" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="stock" class="form-label fw-semibold">Jumlah Stok <span class="text-danger">*</span></label>
                            <input type="number" min="0" class="form-control" id="stock" name="stock" value="{{ product.stock }}" required>
                        </div>

                        <div class="col-12">
                            <label for="description" class="form-label fw-semibold">Deskripsi Produk</label>
                            <textarea class="form-control" id="description" name="description" rows="3">{{ product.description }}</textarea>
                        </div>

                        <div class="col-12 mt-4 d-flex justify-content-end gap-2">
                            <a href="{{ url_for('index') }}" class="btn btn-light border px-4">Batal</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-circle me-1"></i> Perbarui Data
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
